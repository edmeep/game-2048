<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="./CSS/index.css">
</head>
<body>
    <div class="container">
           <div class="banner">
             <div class="brown"></div>
             <div class="green"></div>
             <div class="blue"></div>
             <div class="red"></div>
             <div class="board">
                   <div class="header">

    <div class="title">2048</div>
    
    <div class="right">
        <div class="score">
            <div class="fen">score</div>
            <div class="num">2048</div>
        </div>
        <div class="last">
            <div class="shang">last</div>
            <div class="num">1024</div>
        </div>
    </div>
    
    <span class="subtitle">JOIN THE TILES AND REACH 2048</span>
</div>
                    <div class="banner1">
                        <div class="realboard">
                            <div class="level1">
                                <div class="block2">2</div>
                                <div class="block4">4</div>
                                <div class="block8">8</div>
                                <div class="block16">16</div>
                            </div>
                            <div class="level2">
                                <div class="block32">32</div>
                                <div class="block64">64</div>
                                <div class="block128">128</div>
                                <div class="block256">256</div>
                            </div>
                            <div class="level3">
                                <div class="block512">512</div>
                                <div class="block1024">1024</div>
                                <div class="block2">2</div>
                                <div class="block4">4</div>
                            </div>
                            <div class="level4">
                                <div class="block8">8</div>
                                <div class="block16">16</div>
                                <div class="block32">32</div>
                                <div class="block2048">2048</div>
                            </div>
                        </div>
                        <div class="state">
                            <div class="ltitle">PLAY STATE</div>
                            <div class="guide">
                                <p>USE ARROW KEYS TO MOVE TILES.</p>
                                <p>MERGE MATCHING NUMBERS.</p>
                                <p>KEEP THE BOARD ALIVE.</p>
                            </div>
                            <div class="show">
                            <div class="best">
                                <div class="max">best</div>
                                <div class="num">2048</div>
                            </div>
                            <div class="moves">
                                <div class="move">moves</div>
                                <div class="num">42</div>
                            </div>
                            </div>
                            <div class="game">
                                <div class="start">NEW GAME</div>
                                <div class="restart">RESTART</div>
                            </div>
                            </div>
                        </div>
                        <div class="tips">OPERATIONS: START A NEW GAME OR RESET.</div>
                    </div>
                </div>
        </div>
    
    </div>
</body>
</html>
